name: aranum CI

# G.5 of iteration G. Runs on push + PR against main. The pipeline mirrors
# `make test` (lint -> unittest -> smoke) so a green CI run is the same as
# a green local `make test`.
#
# Smoke includes a "git working tree clean" check, so PR branches should
# commit any generated changes before pushing.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # Test across the declared support floor (3.9), the dev baseline (3.11), and a
    # current interpreter (3.13). The project claims 3.9+ but historically shipped a
    # SyntaxError that only passed because CI ran a single newer interpreter — the
    # matrix closes that gap. lint/smoke are Python-version-agnostic and run once.
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.11', '3.13']

    steps:
      - name: Checkout (with tags — smoke.sh checks v0.x tags exist)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install shellcheck (apt)
        if: matrix.python-version == '3.11'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends shellcheck

      - name: Install defusedxml (optional — nmap-parse.py uses stdlib fallback if missing, but CI exercises both)
        run: pip install --quiet defusedxml

      - name: Show tool versions
        run: |
          python3 --version
          bash --version | head -1

      - name: py_compile sweep (fast syntax gate on every interpreter)
        run: |
          find . -path ./.git -prune -o -name '*.py' -print0 \
            | xargs -0 python3 -m py_compile

      - name: make lint
        if: matrix.python-version == '3.11'
        run: make lint

      - name: make unittest
        run: make unittest

      - name: make smoke
        if: matrix.python-version == '3.11'
        run: make smoke
